# RUN: yaml2obj -format=elf %s | llvm-readobj -symbols - | FileCheck %s
!ELF
FileHeader:
  Class: ELFCLASS64
  Data: ELFDATA2LSB
  Type: ET_REL
  Machine: EM_X86_64
Sections:
  - Name: .text
    Type: SHT_PROGBITS
    Flags: [ SHF_ALLOC, SHF_EXECINSTR ]
  - Name: .symtab
    Type: SHT_SYMTAB
    Symbols:
      Global:
        - Name: main
          Type: STT_FUNC
          Section: .text
          Value: 0x1
          Size: 2
        - Name: undefined_symbol

# CHECK:      Symbols [
# CHECK-NEXT:   Symbol {
# CHECK-NEXT:     Name:  (0)
# CHECK:        Symbol {
# CHECK-NEXT:     Name: main
# CHECK:          Binding: Global
# CHECK-NEXT:     Type: Function
# CHECK:          Section: .text
# CHECK:        Symbol {
# CHECK:          Name: undefined_symbol
# CHECK:          Section:  (0x0)
